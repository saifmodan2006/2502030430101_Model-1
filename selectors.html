<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Example</title>
    <style>
        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* Element Selector */
        h1 {
            color: blue;
        }

        /* ID Selector */
        #main-title {
            background-color: yellow;
        }

        /* Class Selector */
        .para {
            color: green;
        }

        /* Group Selector */
        h2, p {
            margin: 10px;
        }

        /* Descendant Selector */
        div p {
            border: 1px solid black;
        }

        /* Child Selector */
        div > h3 {
            color: red;
        }

        /* Adjacent Sibling Selector */
        h2 + p {
            background-color: lightgray;
        }

        /* General Sibling Selector */
        h2 ~ span {
            color: purple;
        }

        /* Attribute Selector */
        input[type="text"] {
            border: 2px solid orange;
        }

        /* Hover Pseudo-class */
        button:hover {
            background-color: black;
            color: white;
        }

        /* First-child */
        li:first-child {
            color: red;
        }

        /* Last-child */
        li:last-child {
            color: blue;
        }

        /* nth-child */
        li:nth-child(2) {
            color: green;
        }
    </style>
</head>
<body>

    <h1 id="main-title">CSS Selectors Demo</h1>

    <h2>Heading 2</h2>
    <p class="para">Paragraph after h2 (Adjacent sibling selector)</p>
    <span>Span 1</span>
    <span>Span 2</span>

    <div>
        <h3>Child Heading</h3>
        <p class="para">Paragraph inside div</p>
    </div>

    <input type="text" placeholder="Enter name"><br><br>
    <button>Hover Me</button>

    <ul>
        <li>First Item</li>
        <li>Second Item</li>
        <li>Third Item</li>
    </ul>

</body>
</html>
